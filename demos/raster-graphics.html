<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24-bit Raster Graphics</title>
  <style>
    :root { --ink:#172033; --muted:#667085; --blue:#3157d5; --pale:#f5f7fb; --line:#dfe3ea; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px 20px; color:var(--ink); background:var(--pale); font-family:Inter,system-ui,sans-serif; }
    main { width:min(100%,880px); }
    .top { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:22px; }
    h1 { margin:0; font-size:clamp(1.8rem,5vw,3.2rem); letter-spacing:-.045em; }
    p { margin:8px 0 0; color:var(--muted); }
    .panel { display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:16px; }
    canvas { display:block; width:100%; aspect-ratio:1; border:1px solid var(--line); border-radius:12px; background:white; image-rendering:pixelated; }
    .controls { padding:20px; border:1px solid var(--line); border-radius:12px; background:white; }
    .controls h2 { margin:0 0 18px; font-size:.9rem; }
    .control { padding:14px 0; border-top:1px solid var(--line); }
    .control strong,.control small { display:block; }
    .control strong { font-size:.8rem; }
    .control small { margin-top:4px; color:var(--muted); }
    .status { margin-top:16px; padding:12px; border-radius:8px; background:var(--pale); font:12px/1.8 monospace; }
    button { width:100%; margin-top:16px; padding:9px; border:1px solid var(--blue); border-radius:7px; color:var(--blue); background:white; cursor:pointer; }
    button:hover { color:white; background:var(--blue); }
    .control-buttons { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .control-buttons button { margin-top:8px; font-size:1.1rem; }
    @media(max-width:680px){.top{align-items:start;flex-direction:column}.panel{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.controls h2,.status,.controls>button{grid-column:1/-1}}
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div><h1>24-bit Raster Graphics</h1><p>A 24-bit smile drawn pixel by pixel. Move the pointer over the canvas.</p></div>
    </div>

    <div class="panel">
      <canvas id="canvas" width="200" height="200" aria-label="Interactive 24-bit smile sprite"></canvas>
      <aside class="controls">
        <h2>Transformation controls</h2>
        <div class="control">
          <strong>Scale</strong>
          <div class="control-buttons">
            <button id="scale-down" type="button" aria-label="Scale down">−</button>
            <button id="scale-up" type="button" aria-label="Scale up">+</button>
          </div>
          <small>Keyboard: ↑ / ↓ (hold)</small>
        </div>
        <div class="control">
          <strong>Rotate</strong>
          <div class="control-buttons">
            <button id="rotate-left" type="button" aria-label="Rotate left">↺</button>
            <button id="rotate-right" type="button" aria-label="Rotate right">↻</button>
          </div>
          <small>Keyboard: ← / → (hold)</small>
        </div>
        <div class="status">
          <div id="position">X: 100 · Y: 100</div>
          <div id="rotation">Rotation: 0°</div>
          <div id="scale">Scale: 1.0×</div>
        </div>
        <button id="reset" type="button">Reset</button>
      </aside>
    </div>
  </main>

  <script src="../assets/js/raster-graphics.js"></script>
</body>
</html>
