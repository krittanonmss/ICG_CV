<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Object List</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="../simple-orbit-controls.js"></script>
  <script src="scene-layout.js"></script>
  <link rel="stylesheet" href="../layout.css">
  <link rel="stylesheet" href="shaders.css">
</head>
<body class="model-page shader-demo">
<main><a class="back-button" href="index.html" aria-label="กลับ Shader Studies" title="กลับ Shader Studies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg></a><h1>Object List</h1><div class="stage" id="shader-stage"></div><nav class="demo-nav"><div class="demo-links"><a href="toon-shade-torus.html">Toon Shade</a><a href="outline.html">Outline</a><a href="picking-lerp.html">Picking &amp; Lerp</a></div></nav><p class="hint">Drag to orbit · Mouse wheel to zoom</p></main>

  
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.z = 6;
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    
    document.querySelector("#shader-stage").appendChild(renderer.domElement);
    bindShaderViewport(renderer, camera);
  const controls = new SimpleOrbitControls(camera, renderer.domElement);

    const uniforms = {
      uTime: { value: 0 },
      uLightDir: { value: new THREE.Vector3(0.4, 1, 0.8).normalize() },
      uTexture: { value: new THREE.TextureLoader().load('https://threejs.org/examples/textures/uv_grid_opengl.jpg') }
    };
    const vertexShader = `
      uniform float uTime;
      varying vec2 vUv;
      varying vec3 vNormal;
      void main() {
        vUv = uv;
        vNormal = normal;
        vec3 pos = position;
        pos.z += sin(pos.x * 5.0 + uTime) * 0.1;
        gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(pos, 1.0);
      }
    `;
    const fragmentShader = `
      uniform sampler2D uTexture;
      uniform vec3 uLightDir;
      varying vec2 vUv;
      varying vec3 vNormal;
      void main() {
        vec3 color = texture2D(uTexture, vUv).rgb;
        float diffuse = max(dot(normalize(vNormal), normalize(uLightDir)), 0.0);
        diffuse = smoothstep(0.2, 0.3, diffuse);
        gl_FragColor = vec4(color * (diffuse + 0.5), 1.0);
      }
    `;
    const outlineVertex = `
      uniform float uTime;
      void main() {
        vec3 pos = position;
        pos.z += sin(pos.x * 5.0 + uTime) * 0.1;
        pos += normal * 0.08;
        gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(pos, 1.0);
      }
    `;
    const outlineFragment = `void main() { gl_FragColor = vec4(0.1, 0.1, 0.1, 1.0); }`;
    const fill = new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms, side: THREE.DoubleSide });
    const outline = new THREE.ShaderMaterial({
      vertexShader: outlineVertex, fragmentShader: outlineFragment,
      uniforms, side: THREE.BackSide
    });

    function addObject(geometry, x) {
      const mesh = new THREE.Mesh(geometry, fill);
      mesh.position.x = x;
      mesh.add(new THREE.Mesh(geometry, outline));
      scene.add(mesh);
    }
    addObject(new THREE.SphereBufferGeometry(0.75, 32, 32), -2);
    addObject(new THREE.TorusKnotBufferGeometry(0.52, 0.2, 96, 16), 0);
    addObject(new THREE.BoxBufferGeometry(1.25, 1.25, 1.25, 12, 12, 12), 2);

    
    function animate(time) {
      uniforms.uTime.value = time * 0.001;
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
