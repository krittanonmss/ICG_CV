<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paint Canvas</title>
  <link rel="stylesheet" href="../layout.css">
  <style>
    .paint-page { height: 100vh; height: 100dvh; min-height: 0; box-sizing: border-box; overflow: hidden; padding: 68px 20px 20px; }
    .paint-page .app { width: 100%; max-width: 960px; margin: 0 auto; min-height: 0; display: flex; flex-direction: column; }
    .paint-page .workspace { display: flex; flex-direction: column; min-height: 0; }
    .paint-page .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 0; margin: 10px 0 0; order: 1; }
    .paint-page #clear-canvas { margin-top: 0; }
    .paint-page .toolbar { flex-shrink: 0; }
    .paint-page .canvas-wrap { width: 100%; height: min(540px, calc((100vw - 40px) * 9 / 16), calc(100dvh - 220px)); min-width: 0; min-height: 0; box-sizing: border-box; border: 2px solid #343b50; }
    .paint-page #paint-canvas { width: 100%; height: 100%; }
    .paint-page .color-bar { flex-shrink: 0; margin-left: 0; padding: 0; }
    .back-button { position: fixed; top: 14px; left: 14px; z-index: 3; display: grid; place-items: center; box-sizing: border-box; width: 42px; height: 42px; border: 1px solid rgba(45,50,65,.14); border-radius: 50%; background: rgba(255,255,255,.86); color: #343b50; box-shadow: 0 2px 10px rgba(0,0,0,.1); text-decoration: none; }
    .back-button svg { width: 22px; height: 22px; }
    .back-button:hover { background: #f4f2ee; }
    .back-button:focus-visible { outline: 2px solid #343b50; outline-offset: 2px; }
    @media (max-width: 650px) {
      .paint-page { padding: 68px 20px 20px; }
      .paint-page .toolbar { margin: 10px 0 0; }
      .paint-page .color-bar { margin-left: 0; }
    }
  </style>
</head>
<body class="paint-page"><main class="app">
  <a class="back-button" href="../index.html" aria-label="กลับห้อง Portfolio" title="กลับห้อง Portfolio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg>
  </a>
  <h1>Paint Canvas</h1>
  <div class="workspace">
    <aside class="toolbar" aria-label="Drawing tools">
      <div class="tool-grid"><button class="tool-button active" data-tool="pencil">Pencil</button><button class="tool-button" data-tool="eraser">Eraser</button><button class="tool-button" data-tool="line">Line</button><button class="tool-button" data-tool="rectangle">Rect</button><button class="tool-button" data-tool="ellipse">Ellipse</button></div>
      <div class="width-options" aria-label="Line width">
        <button class="width-button" data-width="1" aria-label="1 pixel"><span style="height:1px"></span></button><button class="width-button active" data-width="2" aria-label="2 pixels"><span style="height:2px"></span></button><button class="width-button" data-width="4" aria-label="4 pixels"><span style="height:4px"></span></button><button class="width-button" data-width="6" aria-label="6 pixels"><span style="height:6px"></span></button><button class="width-button" data-width="10" aria-label="10 pixels"><span style="height:10px"></span></button><button class="width-button" data-width="16" aria-label="16 pixels"><span style="height:16px"></span></button><button class="width-button" data-width="24" aria-label="24 pixels"><span style="height:24px"></span></button>
      </div><button id="clear-canvas" type="button">Clear canvas</button>
    </aside>
    <div class="canvas-wrap"><canvas id="paint-canvas" width="790" height="520" aria-label="Drawing canvas"></canvas></div>
  </div>
  <section class="color-bar" aria-label="Color palette"><span id="current-color" class="current" title="#172033"></span><div id="palette" class="palette"></div><span id="tool-status" hidden>Pencil</span></section>
</main><script src="app.js"></script></body>
</html>
