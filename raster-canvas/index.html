<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>24-bit Raster Graphics</title>
  <link rel="stylesheet" href="../layout.css">
  <style>
    .raster-page { height: 100vh; height: 100dvh; box-sizing: border-box; overflow: hidden; padding: 68px 20px 20px; }
    .raster-page main { width: 100%; max-width: 960px; margin: 0 auto; min-height: 0; }
    .raster-page .panel { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 12px; height: min(540px, calc(100dvh - 100px)); min-height: 0; }
    .raster-page .controls { display: block; min-height: 0; overflow-y: auto; overflow-wrap: anywhere; margin: 0; padding-right: 12px; }
    .raster-page .canvas-wrap { width: 100%; min-height: 0; box-sizing: border-box; border: 2px solid #343b50; }
    .raster-page #canvas { width: 100%; height: 100%; aspect-ratio: auto; touch-action: none; }
    .back-button { position: fixed; top: 14px; left: 14px; z-index: 3; display: grid; place-items: center; box-sizing: border-box; width: 42px; height: 42px; border: 1px solid rgba(45,50,65,.14); border-radius: 50%; background: rgba(255,255,255,.86); color: #343b50; box-shadow: 0 2px 10px rgba(0,0,0,.1); text-decoration: none; }
    .back-button svg { width: 22px; height: 22px; }
    .back-button:hover { background: #f4f2ee; }
    .back-button:focus-visible { outline: 2px solid #343b50; outline-offset: 2px; }
    @media (max-width: 650px) {
      .raster-page .panel { grid-template-columns: minmax(0, 1fr) 120px; gap: 8px; }
    }
  </style>
</head>
<body class="raster-page"><main>
  <a class="back-button" href="../index.html" aria-label="กลับห้อง Portfolio" title="กลับห้อง Portfolio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg></a>
  <h1>Raster Canvas</h1>
  <div class="panel">
    <div class="canvas-wrap"><canvas id="canvas" width="200" height="200" aria-label="Interactive 24-bit smile sprite"></canvas></div>
    <aside class="controls" aria-label="Transformation controls"><h2>Transformation controls</h2>
      <div class="control"><strong>Interactive</strong><p>เลื่อนเมาส์ในพื้นที่แสดงผลเพื่อย้ายภาพตามตำแหน่งเมาส์</p></div>
      <h2>Keyboard event</h2>
      <div class="control"><strong>Scale</strong><div class="control-buttons"><button id="scale-down" type="button" aria-label="Scale down">−</button><button id="scale-up" type="button" aria-label="Scale up">+</button></div><small>Keyboard: ↑ / ↓ (hold)</small></div>
      <div class="control"><strong>Rotate</strong><div class="control-buttons"><button id="rotate-left" type="button" aria-label="Rotate left">↺</button><button id="rotate-right" type="button" aria-label="Rotate right">↻</button></div><small>Keyboard: ← / → (hold)</small></div>
      <div class="status"><div id="position">X: 100 · Y: 100</div><div id="rotation">Rotation: 0°</div><div id="scale">Scale: 1.0×</div></div><button id="reset" type="button">Reset</button>
    </aside>
  </div>
</main><script src="app.js"></script></body>
</html>
